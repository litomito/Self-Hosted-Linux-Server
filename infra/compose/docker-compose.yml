services:
  app_blue:
    build:
      context: ../../app/status-app
    container_name: app_blue
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - SLOT=blue
      - APP_VERSION=${APP_VERSION:-0.1.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s

  app_green:
    build:
      context: ../../app/status-app
    container_name: app_green
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - SLOT=green
      - APP_VERSION=${APP_VERSION:-0.1.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/active_upstream.conf:/etc/nginx/conf.d/active_upstream.conf:ro
      - ../nginx/upstream_blue.conf:/etc/nginx/conf.d/upstream_blue.conf:ro
      - ../nginx/upstream_green.conf:/etc/nginx/conf.d/upstream_green.conf:ro
    depends_on:
      - app_blue
      - app_green

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      - node_exporter
      - cadvisor
      - alertmanager

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/host/tmp/node-exporter
    volumes:
      - /:/host:ro,rslave
      - /tmp/node-exporter:/host/tmp/node-exporter

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  blackbox_exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox_exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ../observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml

  discord_webhook:
    build:
      context: ../../control-api
    container_name: discord_webhook
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ../../.env

  dashboard:
    build:
      context: ../../dashboard
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BLUE_HEALTH_URL=http://app_blue:3000/health
      - GREEN_HEALTH_URL=http://app_green:3000/health
      - LIVE_HEALTH_URL=http://nginx/health
      - PROMETHEUS_URL=http://prometheus:9090
      - INCIDENT_DIR=/home/server/Self-Hosted-Linux-Server/docs/incidents
      - OS_UPDATE_DIR=/home/server/Self-Hosted-Linux-Server/docs/os-updates
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/server/Self-Hosted-Linux-Server:/home/server/Self-Hosted-Linux-Server
    depends_on:
      - app_blue
      - app_green
      - nginx
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
