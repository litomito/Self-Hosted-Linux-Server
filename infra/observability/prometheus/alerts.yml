groups:
  - name: platform-alerts
    rules:
      - alert: HighHostCPUUsage
        expr: (100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100)) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High host CPU usage"
          description: "Host CPU usage has been above 85% for more than 2 minutes."

      - alert: DeployFailed
        expr: platform_last_deploy_success == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Last deploy failed"
          description: "The latest deployment was marked as failed."

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target is down"
          description: "A Prometheus scrape target has been down for more than 15 seconds."

      - alert: ContainerUnhealthy
        expr: platform_container_health == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Container unhealthy"
          description: "Container {{ $labels.container }} is unhealthy or not running."

      - alert: AppHealthCheckFailed
        expr: probe_success{job=~"blackbox_app_blue_health|blackbox_app_green_health|blackbox_nginx_health"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Health check failed"
          description: "Health endpoint check failed for {{ $labels.job }} for at least 3 consecutive scrapes."
