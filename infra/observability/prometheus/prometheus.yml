global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: blackbox_app_blue_health
    metrics_path: /probe
    params:
      module: [http_2xx]
      target: [http://app_blue:3000/health]
    static_configs:
      - targets: ["blackbox_exporter:9115"]

  - job_name: blackbox_app_green_health
    metrics_path: /probe
    params:
      module: [http_2xx]
      target: [http://app_green:3000/health]
    static_configs:
      - targets: ["blackbox_exporter:9115"]

  - job_name: blackbox_nginx_health
    metrics_path: /probe
    params:
      module: [http_2xx]
      target: [http://nginx/_nginx_health]
    static_configs:
      - targets: ["blackbox_exporter:9115"]
